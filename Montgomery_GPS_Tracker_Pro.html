<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Montgomery County GPS Tracker</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
body{margin:0;font-family:Arial,sans-serif}
#map{height:85vh;width:100%}
#panel{padding:10px;background:#f4f4f4}
button{padding:8px 12px;margin-right:8px}
</style>
</head>
<body>
<div id="panel">
<button onclick="startTracking()">Start GPS Tracking</button>
<button onclick="saveTrack()">Save Track</button>
<span id="status">Waiting for GPS...</span>
</div>
<div id="map"></div>
<script>
var map=L.map('map').setView([35.307696,-80.013213],15);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20}).addTo(map);
var marker=null;
var points=[];
var line=L.polyline([], {color:'red'}).addTo(map);
function startTracking(){
 navigator.geolocation.watchPosition(function(pos){
  let lat=pos.coords.latitude;
  let lon=pos.coords.longitude;
  document.getElementById('status').innerHTML=`Lat ${lat.toFixed(6)} Lon ${lon.toFixed(6)}`;
  if(marker){map.removeLayer(marker);} 
  marker=L.marker([lat,lon]).addTo(map);
  map.setView([lat,lon],18);
  points.push([lat,lon]);
  line.setLatLngs(points);
 },function(err){alert(err.message);},{enableHighAccuracy:true});
}
function saveTrack(){
 let text='Latitude,Longitude
';
 points.forEach(p=>text+=p[0]+','+p[1]+'
');
 let blob=new Blob([text],{type:'text/csv'});
 let a=document.createElement('a');
 a.href=URL.createObjectURL(blob);
 a.download='gps_track.csv';
 a.click();
}
</script>
</body>
</html>
